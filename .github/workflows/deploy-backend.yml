name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: bcmath, mbstring, pdo_mysql, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict --no-check-publish

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "${{ secrets.HOSTINGER_SSH_PORT }}" "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure backend directories exist
        run: |
          ssh -i ~/.ssh/hostinger_key -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "mkdir -p '${{ secrets.HOSTINGER_BACKEND_PATH }}' '${{ secrets.HOSTINGER_BACKEND_PATH }}/storage/app/public' '${{ secrets.HOSTINGER_BACKEND_PATH }}/storage/framework/cache/data' '${{ secrets.HOSTINGER_BACKEND_PATH }}/storage/framework/sessions' '${{ secrets.HOSTINGER_BACKEND_PATH }}/storage/framework/views' '${{ secrets.HOSTINGER_BACKEND_PATH }}/storage/logs' '${{ secrets.HOSTINGER_BACKEND_PATH }}/bootstrap/cache'"

      - name: Deploy backend files
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='node_modules/' \
            -e "ssh -i ~/.ssh/hostinger_key -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            ./ \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_BACKEND_PATH }}/"

      - name: Write production environment
        run: |
          cat > .env.production <<'EOF'
          APP_NAME="Family Tree API"
          APP_ENV=production
          APP_KEY=${{ secrets.PROD_APP_KEY }}
          APP_DEBUG=false
          APP_URL=${{ secrets.PROD_APP_URL }}
          FRONTEND_URL=${{ secrets.PROD_FRONTEND_URL }}

          APP_LOCALE=en
          APP_FALLBACK_LOCALE=en
          APP_FAKER_LOCALE=en_US

          LOG_CHANNEL=stack
          LOG_STACK=single
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=${{ secrets.PROD_DB_HOST }}
          DB_PORT=3306
          DB_DATABASE=${{ secrets.PROD_DB_DATABASE }}
          DB_USERNAME=${{ secrets.PROD_DB_USERNAME }}
          DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }}

          SESSION_DRIVER=database
          SESSION_LIFETIME=120
          SESSION_ENCRYPT=false
          SESSION_PATH=/
          SESSION_DOMAIN=.khajamynuddin.com
          SANCTUM_STATEFUL_DOMAINS=familytree.khajamynuddin.com

          BROADCAST_CONNECTION=log
          FILESYSTEM_DISK=local
          QUEUE_CONNECTION=database
          CACHE_STORE=database

          MAIL_MAILER=log
          MAIL_FROM_ADDRESS="hello@example.com"
          MAIL_FROM_NAME="Family Tree API"
          EOF

          scp -i ~/.ssh/hostinger_key -P "${{ secrets.HOSTINGER_SSH_PORT }}" \
            .env.production \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${{ secrets.HOSTINGER_BACKEND_PATH }}/.env"

      - name: Run Laravel production commands
        run: |
          ssh -i ~/.ssh/hostinger_key -p "${{ secrets.HOSTINGER_SSH_PORT }}" \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "cd '${{ secrets.HOSTINGER_BACKEND_PATH }}' && \
            PHP_BIN='/opt/alt/php84/usr/bin/php' && \
            if [ ! -x \"\$PHP_BIN\" ]; then echo 'PHP 8.4 binary not found at /opt/alt/php84/usr/bin/php. Set the Hostinger API subdomain and SSH PHP version to PHP 8.4.'; exit 1; fi && \
            \"\$PHP_BIN\" -v && \
            \"\$PHP_BIN\" artisan migrate --force && \
            (\"\$PHP_BIN\" artisan storage:link || true) && \
            \"\$PHP_BIN\" artisan config:cache && \
            \"\$PHP_BIN\" artisan route:cache && \
            \"\$PHP_BIN\" artisan view:cache"
