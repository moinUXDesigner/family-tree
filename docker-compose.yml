services:
  mariadb:
    image: mariadb:11.4
    container_name: familytree-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: family_tree
      MARIADB_USER: family_user
      MARIADB_PASSWORD: family_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: familytree-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: familytree-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: family_user
      PMA_PASSWORD: family_password
      UPLOAD_LIMIT: 128M
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:
